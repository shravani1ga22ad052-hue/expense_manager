[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-manager"
version = "0.1.0"
description = "Automated expense management and reporting system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "openpyxl>=3.1",
  "flask>=3.0",
]

[project.scripts]
expense-manager = "expense_manager.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
